name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # La key viaja por stdin (no aparece en argv ni en los logs del runner).
          printf '%s' "$ANTHROPIC_API_KEY" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/buscatumedico
            KEY="$(cat)"
            if [ -n "$KEY" ]; then
              touch .env.local
              grep -v "^ANTHROPIC_API_KEY=" .env.local > .env.local.tmp 2>/dev/null || true
              printf "ANTHROPIC_API_KEY=%s\n" "$KEY" >> .env.local.tmp
              mv .env.local.tmp .env.local
            fi
            git fetch origin main
            git reset --hard origin/main
            npm install --no-audit --no-fund
            NODE_OPTIONS=--max-old-space-size=3072 npm run build
            pm2 restart all --update-env
            pm2 save
          '
